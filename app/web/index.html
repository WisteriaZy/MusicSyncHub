<!-- ============================================================
     图标集合（内联 SVG sprite，避免外部字体依赖）
     用法：<svg class="ico"><use href="#i-play"></use></svg>
     风格对标 Windows 10 1903 的 Segoe MDL2 Assets：
     细线 1.5px 描边 + 圆头圆角（描边规则统一写在 app.css 的 .ico 上）。
     需要实心的图标（播放/暂停等）另加 class="ico fill"。
     ============================================================ -->
<svg style="display:none" aria-hidden="true">

  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 3.6V8h-4.4"/></symbol>
  <symbol id="i-plug" viewBox="0 0 24 24"><path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v2.2a5.5 5.5 0 0 1-11 0V8z"/><path d="M12 15.7V21"/></symbol>
  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2.4h7A1.5 1.5 0 0 1 19 8.9v8.6a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5v-11z"/></symbol>

  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6.5h16"/><path d="M9 6.5V4.6A1.1 1.1 0 0 1 10.1 3.5h3.8A1.1 1.1 0 0 1 15 4.6v1.9"/><path d="M6.4 6.5l.9 12.2a1.6 1.6 0 0 0 1.6 1.5h6.2a1.6 1.6 0 0 0 1.6-1.5l.9-12.2"/><path d="M10.4 10.5v6.4M13.6 10.5v6.4"/></symbol>
  <!-- 播放控制：实心 -->
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.2l11 6.8-11 6.8z"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><path d="M7.5 4.5h3.2v15H7.5zM13.3 4.5h3.2v15h-3.2z"/></symbol>
  <symbol id="i-prev" viewBox="0 0 24 24"><path d="M6.5 5h2.2v14H6.5zM18.5 5v14L9.2 12z"/></symbol>
  <symbol id="i-next" viewBox="0 0 24 24"><path d="M15.3 5h2.2v14h-2.2zM5.5 5l9.3 7-9.3 7z"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.3 15.3L21 21"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.8l5 5L19.5 7"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.1"/><path d="M12 2.8v2.6M12 18.6v2.6M4.5 7.5l2.3 1.3M17.2 15.2l2.3 1.3M4.5 16.5l2.3-1.3M17.2 8.8l2.3-1.3"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6.5h1.6M8.5 6.5H20M4 12h1.6M8.5 12H20M4 17.5h1.6M8.5 17.5H20"/></symbol>

  <symbol id="i-loop" viewBox="0 0 24 24"><path d="M7 5.5h9.5a3.5 3.5 0 0 1 0 7H7.5a3.5 3.5 0 0 0 0 7H17"/><path d="M9.2 3.2L6.9 5.5l2.3 2.3"/><path d="M14.8 17.2l2.3 2.3-2.3 2.3"/></symbol>
  <symbol id="i-loop-one" viewBox="0 0 24 24"><path d="M7 5.5h9.5a3.5 3.5 0 0 1 0 7H7.5a3.5 3.5 0 0 0 0 7H17"/><path d="M9.2 3.2L6.9 5.5l2.3 2.3"/><path d="M14.8 17.2l2.3 2.3-2.3 2.3"/><path d="M11.4 10.2h1.2v3.6"/></symbol>
  <symbol id="i-queue-add" viewBox="0 0 24 24"><path d="M4 6.5h1.6M8.5 6.5H20M4 12h1.6M8.5 12H20M4 17.5h1.6M8.5 17.5H14"/><path d="M17 15v6M14 18h6"/></symbol>
  <symbol id="i-eq" viewBox="0 0 24 24"><path d="M5 15.5V8.5M12 19V5M19 15.5V8.5"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16.5V4.5"/><path d="M7.8 8.7L12 4.5l4.2 4.2"/><path d="M4.5 15.5v3a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5v-3"/></symbol>
  <symbol id="i-resume" viewBox="0 0 24 24"><path d="M7 4.8l12 7.2-12 7.2z"/></symbol>
  <symbol id="i-rollback" viewBox="0 0 24 24"><path d="M4 10.5h10.5a4.5 4.5 0 0 1 0 9H8"/><path d="M7.8 6.3L4 10.5l3.8 4.2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4.5l8.5 15h-17z"/><path d="M12 10v4.2M12 17.2v.1"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4.5" width="7.5" height="15" rx="1.2"/><rect x="13.5" y="4.5" width="7.5" height="15" rx="1.2"/><path d="M12 9.5l-1.6 1.6M12 9.5l1.6 1.6"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8.5" y="8.5" width="11.5" height="11.5" rx="1.4"/><path d="M15.5 8.5v-3A1.4 1.4 0 0 0 14.1 4H5.4A1.4 1.4 0 0 0 4 5.4v8.7a1.4 1.4 0 0 0 1.4 1.4h3"/></symbol>
  <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.6 12a8.4 8.4 0 1 0 2.5-6"/><path d="M3.4 3.8v4.4h4.4"/><path d="M12 7.6V12l3.1 1.8"/></symbol>
  <symbol id="i-disk" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="1.6"/><path d="M3 11h18"/><circle cx="16.6" cy="15.4" r="1.3"/><path d="M6.4 15.4h4.6"/></symbol>
  <symbol id="i-db" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7.6" ry="2.9"/><path d="M4.4 6v12c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9V6"/><path d="M4.4 12c0 1.6 3.4 2.9 7.6 2.9s7.6-1.3 7.6-2.9"/></symbol>
  <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.4M12 7.9h.01"/></symbol>
  <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="1.8"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.6 0v2.8"/><path d="M12 14v2.4"/></symbol>
  <symbol id="i-unlock" viewBox="0 0 24 24"><rect x="4.6" y="10.4" width="14.8" height="9.6" rx="1.8"/><path d="M8.2 10.4V7.6a3.8 3.8 0 0 1 7.4-1.1"/><path d="M12 14v2.4"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3.6v11.2"/><path d="M7.6 10.4L12 14.8l4.4-4.4"/><path d="M4.4 19.4h15.2"/></symbol>
  <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3.6 5.4h16.8l-6.6 7.6v5.6l-3.6 2v-7.6L3.6 5.4z"/></symbol>
  <symbol id="i-warn" viewBox="0 0 24 24"><path d="M12 3.6l9 16.2H3l9-16.2z"/><path d="M12 9.6v4.6M12 16.9h.01"/></symbol>
  <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2.6 12S6.4 5.6 12 5.6 21.4 12 21.4 12 17.6 18.4 12 18.4 2.6 12 2.6 12z"/><circle cx="12" cy="12" r="3.1"/></symbol>
  <symbol id="i-bars" viewBox="0 0 24 24"><path d="M5.5 20V11M12 20V4.6M18.5 20v-6.2"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M8 4.6v14.8M8 4.6L4.8 8M8 4.6L11.2 8"/><path d="M16 19.4V4.6M16 19.4L12.8 16M16 19.4L19.2 16"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3.6 7h16.8M3.6 12h16.8M3.6 17h16.8"/></symbol>
  <symbol id="i-save" viewBox="0 0 24 24"><path d="M4.6 4.6h11.6L19.4 8v11.4H4.6V4.6z"/><path d="M8.4 4.6v5.2h6.2V4.6"/><rect x="7.8" y="13.6" width="8.4" height="5.8" rx="1"/></symbol>
  <symbol id="i-volume" viewBox="0 0 24 24"><path d="M4.4 9.4h3.2L12 5.4v13.2l-4.4-4H4.4V9.4z"/><path d="M15.4 9.6a3.6 3.6 0 0 1 0 4.8"/><path d="M17.9 7a7.2 7.2 0 0 1 0 10"/></symbol>
  <symbol id="i-link" viewBox="0 0 24 24"><path d="M10.2 13.8a3.6 3.6 0 0 0 5.1 0l3-3a3.6 3.6 0 0 0-5.1-5.1l-1.3 1.3"/><path d="M13.8 10.2a3.6 3.6 0 0 0-5.1 0l-3 3a3.6 3.6 0 0 0 5.1 5.1l1.3-1.3"/></symbol>

<div id="app">
  <!-- ================================================= 顶栏 -->
  <header class="topbar">
    <button class="btn ghost icon" id="btn-nav" title="显示/隐藏导航窗格">
      <svg class="ico"><use href="#i-menu"></use></svg>
    </button>
    <div class="brand">
      <svg class="ico lg"><use href="#i-music"></use></svg>
      <span>Music Sync Hub</span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-view="sources"><svg class="ico"><use href="#i-db"></use></svg><span>数据源</span></button>
      <button class="tab" data-view="library"><svg class="ico"><use href="#i-list"></use></svg><span>曲库浏览</span></button>
      <button class="tab" data-view="files"><svg class="ico"><use href="#i-folder"></use></svg><span>文件浏览</span></button>
      <button class="tab" data-view="station">中转站</button>
      <button class="tab" data-view="compare"><svg class="ico"><use href="#i-compare"></use></svg><span>双栏对比</span></button>
      <button class="tab" data-view="duplicates"><svg class="ico"><use href="#i-copy"></use></svg><span>查重</span></button>
      <button class="tab" data-view="ops"><svg class="ico"><use href="#i-history"></use></svg><span>操作记录</span></button>
      <button class="tab" data-view="settings"><svg class="ico"><use href="#i-settings"></use></svg><span>设置</span></button>
    </nav>
    <div class="top-right">
      <span id="sys-badge" class="badge" title="系统状态">…</span>
      <div id="job-pill" class="job-pill hidden" title="点击查看任务">
        <span class="spinner"></span><span id="job-text">扫描中</span>
      </div>
      <button class="btn ghost sm" id="btn-reload-cfg" title="重新读取 config.toml">
        <svg class="ico"><use href="#i-refresh"></use></svg><span>重载配置</span>
      </button>
    </div>
  </header>

  <div id="busy-bar" class="busy-bar hidden"></div>
  <div class="body">
    <!-- =============================================== 导航窗格 -->
    <aside class="sidebar" id="sidebar">
      <div class="side-block">
        <div class="side-title">数据源 <span class="count" id="src-count">0</span></div>
        <div id="side-sources" class="side-sources"></div>
        <div style="padding:8px 12px">
          <button class="btn block sm" id="btn-add-source">
            <svg class="ico"><use href="#i-plus"></use></svg><span>添加数据源</span>
          </button>
        </div>
      </div>
      <div class="side-block" id="side-tree-block">
        <div class="side-title">目录</div>
        <div id="side-tree" class="tree"><div class="muted pad">选择一个数据源后显示</div></div>
      </div>
    </aside>

    <!-- =============================================== 主区 -->
    <main class="main" id="main">
      <section class="view" id="view-sources"></section>
      <section class="view hidden" id="view-library"></section>
      <section class="view hidden" id="view-files"></section>
      <section class="view hidden" id="view-station"></section>
      <section class="view hidden" id="view-compare"></section>
      <section class="view hidden" id="view-duplicates"></section>
      <section class="view hidden" id="view-ops"></section>
      <section class="view hidden" id="view-settings"></section>
    </main>
  </div>

  <!-- ================================================= 播放条 -->
  <footer class="player" id="player">
    <div class="now" id="now">
      <div class="np-cover" id="np-cover">
        <svg class="ico lg"><use href="#i-music"></use></svg>
      </div>
      <div class="np-meta">
        <div class="np-title" id="np-title">未播放</div>
        <div class="np-sub" id="np-sub">点击曲目右侧 ▶ 可试听（支持拖动进度条）</div>
      </div>
    </div>
    <audio id="audio" preload="none"></audio>
    <div class="player-ctl">
      <button class="btn ghost icon" id="btn-prev" title="上一首"><svg class="ico fill"><use href="#i-prev"></use></svg></button>
      <button class="btn ghost icon" id="btn-play" title="播放/暂停"><svg class="ico fill"><use href="#i-play"></use></svg></button>
      <button class="btn ghost icon" id="btn-next" title="下一首"><svg class="ico fill"><use href="#i-next"></use></svg></button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <span class="time" id="time">0:00 / 0:00</span>
      <label class="vol"><svg class="ico"><use href="#i-volume"></use></svg>
        <input type="range" id="vol" min="0" max="100" value="100"></label>
      <span class="badge stream" id="stream-badge"></span>
      <button class="btn ghost icon" id="btn-shuffle" title="随机播放（S）">
        <svg class="ico"><use href="#i-shuffle"></use></svg></button>
      <button class="btn ghost icon" id="btn-loop" title="循环：关 → 队列 → 单曲（L）">
        <svg class="ico"><use href="#i-loop"></use></svg></button>
      <button class="btn ghost icon" id="btn-queue" title="播放队列（Q）">
        <svg class="ico"><use href="#i-list"></use></svg>
        <span class="q-count" id="q-count"></span></button>
    </div>
  </footer>
</div>

<div id="modal-root"></div>
<!-- 必须带 class="toast-wrap"：定位是挂在 .toast-wrap 上的。
     之前这里只有 id 没有 class，于是 toast 是 position:static，
     落在页脚之后（首屏之外）—— 所有操作反馈用户都看不见。 -->
<div id="toast-root" class="toast-wrap"></div>
<script src="/static/js/prefs.js?v=122"></script>
  <script src="/static/js/api.js?v=122"></script>
<script src="/static/js/ui.js?v=122"></script>
<script src="/static/js/tasksync.js?v=122"></script>
<script src="/static/js/app.js?v=122"></script>
<script src="/static/js/views.sources.js?v=122"></script>
<script src="/static/js/views.library.js?v=122"></script>
<script src="/static/js/folderpicker.js?v=122"></script>
<script src="/static/js/staging.js?v=122"></script>
<script src="/static/js/upload.js?v=122"></script>
<script src="/static/js/tags.js?v=122"></script>
<script src="/static/js/organize.js?v=122"></script>
<script src="/static/js/views.files.js?v=122"></script>
<script src="/static/js/views.station.js?v=122"></script>
  <script src="/static/js/views.compare.js?v=122"></script>
<script src="/static/js/views.duplicates.js?v=122"></script>
<script src="/static/js/views.ops.js?v=122"></script>
<script src="/static/js/views.settings.js?v=122"></script>
<script>App.boot();</script>
</body>
</html>
