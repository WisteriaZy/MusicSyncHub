name: tests

# 只做"能不能跑、有没有坏"的最低限度检查。
# 这个项目是 Windows 桌面工具，UI 相关的东西（截图、CDP 探针）在 CI 里没有意义，
# 所以这里只跑纯逻辑测试 + 静态检查。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" mutagen pillow httpx paramiko
          python -m pip install -e . || python -m pip install .

      - name: 单元测试
        # 没有 node 时 5 条 JS 队列测试会干净跳过（不是失败）
        run: python -m unittest discover -s tests -t .
        env:
          PYTHONUTF8: "1"

      - name: 前端静态检查 + 拆分专项审计
        run: |
          python tools/check_frontend.py
          python tools/audit_frontend.py
          python tools/audit_split.py
        env:
          PYTHONUTF8: "1"

  smoke:
    # 冒烟测试要真的起一个服务，单独一个 job 免得拖慢矩阵
    name: 接口冒烟
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install fastapi "uvicorn[standard]" mutagen pillow httpx paramiko
          python -m pip install -e . || python -m pip install .

      - name: 起服务并冒烟
        shell: pwsh
        env:
          PYTHONUTF8: "1"
          # ★ 关键：把数据目录指到临时目录，绝不碰仓库里的任何配置
          MSH_DATA_DIR: ${{ runner.temp }}\msh-ci-data
        run: |
          Start-Process -FilePath python -ArgumentList '-u','-m','app.main','--port','8787' `
            -RedirectStandardOutput "$env:RUNNER_TEMP\srv.log" `
            -RedirectStandardError "$env:RUNNER_TEMP\srv.err" -NoNewWindow
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest 'http://127.0.0.1:8787/api/system' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { "服务已就绪"; break }
            } catch { }
          }
          python tools/smoke_api.py
